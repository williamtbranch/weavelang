# Configuration for the WeaveLang Data Pipeline

# --- Core Path Configuration ---
# Absolute path to the content project directory (e.g., 'audiolingual')
# This directory should contain subdirectories like 'Staged' and 'stage'.
content_project_dir = "E:\\Bill\\Documents\\development\\audiolingual"


# --- Central Model Definitions ---
# Define each available LLM here. Stages will refer to them by their key (e.g., "haiku").
# 'max_input_tokens' is an *estimated* safe limit for the total tokens in a prompt.
# It should be comfortably less than the model's absolute maximum context window.
[models]
    [models.gemini-flash-lite]
    provider = "gemini"
    name = "gemini-2.5-flash-lite-preview-06-17"
    #name = "gemini-2.5-flash"
    max_input_tokens = 10000 # Can be very high
    
    [models.gemini-flash]
    provider = "gemini"
    #name = "gemini-2.5-flash-lite-preview-06-17"
    name = "gemini-2.5-flash"
    max_input_tokens = 10000 # Can be very high

    [models.haiku]
    provider = "claude"
    name = "claude-3-5-haiku-20241022"
    #name = "claude-3-haiku-20240307"
    max_input_tokens = 4000 # Haiku has a 200K context window 8k output

    [models.sonnet]
    provider = "claude"
    name = "claude-sonnet-4-20250514"
    max_input_tokens = 20000 # Sonnet 3.5 also has a 200K window

    [models.opus]
    provider = "claude"
    name = "claude-opus-4-20250514"
    max_input_tokens = 20000


# --- Global Pipeline Execution Settings ---
[pipeline]
# Default number of times to retry a direct API call (e.g., on a 503 error)
max_api_retries = 3

# Default number of times to retry a batch if it fails *validation* (e.g., malformed output)
# The script will re-prompt the LLM with corrective instructions.
max_validation_retries = 4

# Base delay in seconds between retries.
retry_delay = 7


# --- Per-Stage Configuration ---
# Define settings for each LLM-based stage. The key (e.g., "GenerateAdvSpanish")
# must match the class name of the stage in the Python code.
#
# - primary_model: The key of the model from [models] to use first.
# - fallback_model: The key of the model to use if the primary model fails repeatedly.
# - batch_size_in_tokens: The target token count for a batch. The pipeline will
#   pack as many complete sentences/units as possible without exceeding this limit.
[stages]
    [stages.GenerateAdvSpanish]
    #primary_model = "haiku"
    primary_model = "sonnet"
    fallback_model = "sonnet"
    #fallback_model = ""
    batch_size_in_tokens = 2000

    [stages.SimplifyAdvSpanish]
    primary_model = "sonnet"
    fallback_model = "sonnet"
    batch_size_in_tokens = 1500

    [stages.GenerateSimpleSpanish]
    primary_model = "sonnet"
    fallback_model = "sonnet"
    batch_size_in_tokens = 1000

    [stages.GenerateDiglotMap]
    primary_model = "sonnet"
    fallback_model = "sonnet"
    batch_size_in_tokens = 1000

    [stages.GenerateInverseDiglotMap]
    primary_model = "sonnet"
    fallback_model = "sonnet"
    batch_size_in_tokens = 1000