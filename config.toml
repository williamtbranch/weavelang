# Configuration for the WeaveLang Data Pipeline

# --- Core Path Configuration ---
# Absolute path to YOUR content project directory.
# This is the ONLY path you need to change to point the tool at your data.
content_project_dir = "E:\\Bill\\Documents\\development\\audiolingual"

# --- Optional Frequency List Override ---
# If you want to use a custom frequency list for a specific corpus,
# provide the absolute path to it here.
# If this is commented out or blank, the tool will use its default list
# for the target language from its internal 'assets' directory.
custom_frequency_list_path = ""


# --- Central Model Definitions ---
# This section remains the same.
[models]
    [models.gemini-flash-lite]
    provider = "gemini"
    name = "gemini-2.5-flash-lite-preview-06-17"
    max_input_tokens = 10000

    [models.gemini-pro]
    provider = "gemini"
    name = "models/gemini-2.5-pro" # Or your preferred version
    max_input_tokens = 20000
    
    [models.gemini-flash]
    provider = "gemini"
    name = "gemini-2.5-flash"
    max_input_tokens = 10000

    [models.haiku]
    provider = "claude"
    name = "claude-3-5-haiku-20241022"
    max_input_tokens = 4000

    [models.sonnet]
    provider = "claude"
    name = "claude-sonnet-4-20250514"
    max_input_tokens = 20000

    [models.opus]
    provider = "claude"
    name = "claude-opus-4-1-20250805"
    max_input_tokens = 20000


# --- Global Pipeline Execution Settings ---
# This section remains the same.
[pipeline]
max_api_retries = 3
max_validation_retries = 3
retry_delay = 7
thinking_budget_tokens = 2048


# --- Per-Stage Configuration ---
# This section remains the same.
[stages]
    [stages.Segmenter]
    #primary_model = "gemini-flash" # Use the key from your [models] section
    primary_model = "gemini-pro" # Use the key from your [models] section
    #primary_model = "haiku" # Use the key from your [models] section
    fallback_model = "sonnet"
    batch_size_in_items = 1

    [stages.GenerateBasicBase]       # <-- NEW SECTION
    primary_model = "gemini-pro"
    fallback_model = "sonnet"
    batch_size_in_items = 10

    [stages.TranslateBasicTarget]   # <-- NEW SECTION
    primary_model = "gemini-pro"
    fallback_model = "sonnet"
    batch_size_in_items = 20
    
    [stages.GenerateBasicTarget]     # Alias used by terminal 'run generate'
    primary_model = "gemini-pro"
    fallback_model = "sonnet"
    batch_size_in_items = 20

    [stages.GenerateAdvancedTarget]
    primary_model = "gemini-pro"
    fallback_model = "sonnet"
    batch_size_in_items = 20

    [stages.GenerateModerateTarget]
    primary_model = "gemini-pro"
    fallback_model = "sonnet"
    batch_size_in_items = 10

    [stages.PoolManager_Translation]
    primary_model = "sonnet"
    fallback_model = "sonnet"
    batch_size_in_items = 20 # You can tune this

    [stages.PoolManager_Simplification]
    primary_model = "sonnet" # You could change this to "haiku" to experiment
    fallback_model = "opus"
    batch_size_in_items = 10 # Simplification is faster, can use a larger batch

    [stages.GeneratePhraseMap]
    primary_model = "gemini-pro"
    fallback_model = "opus"
    batch_size_in_items = 1 # You can tune this:W
    # thinking_budget_tokens = 1024  # Omit for dynamic thinking
    thinking_on_first_attempt = true


    [stages.GenerateInverseDiglotMap]
    primary_model = "gemini-pro"
    fallback_model = "opus"
    batch_size_in_items = 3 # You can tune this
    # thinking_budget_tokens = 1024  # Omit for dynamic thinking
    thinking_on_first_attempt = true

    [stages.GenerateInversePhraseMap]
    primary_model = "gemini-pro"
    fallback_model = "opus"
    batch_size_in_items = 1
    # thinking_budget_tokens = 1024  # Omit for dynamic thinking
    thinking_on_first_attempt = true