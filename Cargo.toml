[package]
name = "weavelang_rust_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
# lazy_static = "1.4" // Can add if regex performance becomes an issue
once_cell = "1"
chrono = "0.4"
rand = "0.8"


[dev-dependencies]
regex = "1.10"
once_cell = "1.19"
itertools = "0.12"
pest = "2.7"       
pest_derive = "2.7" 