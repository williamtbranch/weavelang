[package]
name = "weavelang_rust_gui"
version = "0.1.0"
edition = "2021"
default-run = "weavelang_rust_gui"

[lib]
name = "weavelang_rust_gui"
path = "src/lib.rs"

[dependencies]
# GUI Framework
eframe = "0.27.2"
egui = "0.27.2"
rfd = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Logic & Utilities
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
once_cell = "1"
chrono = "0.4"
rand = "0.8"
itertools = "0.12"
csv = "1.3"
dirs = "5"
keyring = "2"

# --- NEW DEPENDENCIES FOR PHASE 2 ---
# We use blocking for simplicity in the first iteration of the Studio
reqwest = { version = "0.11", features = ["blocking", "json"] }
dotenv = "0.15"
# ------------------------------------

# Hashing for cache keys
sha2 = "0.10"
hex = "0.4"

# Tokenizer
tiktoken-rs = "0.5"

# Local API Server
tiny_http = "0.12"

# Open files/directories in system default application
opener = "0.7"

# CLI line-editing with history
rustyline = "14"

[dev-dependencies]
pest = "2.7"       
pest_derive = "2.7" 
serde_json = "1.0"

[[bin]]
name = "weavelang_cli"
path = "src/cli/main.rs"

[[bin]]
name = "weavelang_rust_gui"
path = "src/main.rs"
